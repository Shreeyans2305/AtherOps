<!DOCTYPE html>
<html>
<head>
    <title>Demo Merchant Store (with SDK)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn-danger { background: #dc3545; }
        .section {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🛍️ Demo Merchant Store</h1>
    <p><strong>Merchant ID:</strong> <span id="merchantId">store_demo_123</span></p>
    
    <!-- SDK Configuration -->
    <script>
    window.HealingSDKConfig = {
    merchantId: 'store_demo_123',
    apiUrl: 'ws://localhost:8000/ws/sdk'  // Changed from /ws
    };
    </script>
    
    <!-- Load the SDK -->
    <script src="healing-sdk.js"></script>
    
    <div class="section">
        <h3>🧪 Simulate Errors (for testing)</h3>
        <button class="btn" onclick="simulateJSError()">
            Trigger JavaScript Error
        </button>
        <button class="btn btn-danger" onclick="simulateAPIFailure()">
            Simulate Payment Gateway Timeout
        </button>
        <button class="btn" onclick="simulateSlowAPI()">
            Simulate Slow API Call
        </button>
        <button class="btn" onclick="simulateCheckoutAbandonment()">
            Simulate Checkout Abandonment
        </button>
    </div>
    
    <div class="section">
        <h3>🛒 Checkout Flow</h3>
        <button class="btn" onclick="startCheckout()">Start Checkout</button>
        <div id="checkoutSteps" style="margin-top: 15px;"></div>
    </div>
    
    <script>
        function simulateJSError() {
            // This will be caught by the SDK
            throw new Error('Product price calculation failed - undefined is not a function');
        }
        
        function simulateAPIFailure() {
            // Simulate API call that fails
            fetch('https://payment-gateway.example.com/charge', {
                method: 'POST',
                body: JSON.stringify({ amount: 99.99 })
            }).catch(() => {
                // SDK will capture this
                window.trackPaymentFailure({
                    message: 'Payment gateway timeout - error code 503',
                    code: 503,
                    gateway: 'stripe'
                });
            });
        }
        
        function simulateSlowAPI() {
            // Simulate slow API
            const start = Date.now();
            fetch('https://api.example.com/products?delay=4000')
                .then(() => {
                    console.log('API took:', Date.now() - start, 'ms');
                })
                .catch(() => {});
        }
        
        function simulateCheckoutAbandonment() {
            window.trackCheckout('abandoned', {
                cart_value: 149.99,
                items: 3,
                reason: 'unexpected_shipping_cost'
            });
            alert('Checkout abandoned (tracked by SDK)');
        }
        
        function startCheckout() {
            const steps = document.getElementById('checkoutSteps');
            steps.innerHTML = '<p>Processing checkout...</p>';
            
            window.trackCheckout('started', { cart_value: 149.99 });
            
            setTimeout(() => {
                steps.innerHTML += '<p>✅ Cart validated</p>';
                window.trackCheckout('cart_validated');
            }, 1000);
            
            setTimeout(() => {
                steps.innerHTML += '<p>✅ Shipping calculated</p>';
                window.trackCheckout('shipping_calculated');
            }, 2000);
            
            setTimeout(() => {
                steps.innerHTML += '<p>⏳ Processing payment...</p>';
                window.trackCheckout('payment_processing');
                
                // 50% chance of payment failure
                if (Math.random() > 0.5) {
                    setTimeout(() => {
                        steps.innerHTML += '<p>❌ Payment failed!</p>';
                        window.trackPaymentFailure({
                            message: 'Payment gateway timeout - error code 503',
                            code: 503,
                            gateway: 'stripe'
                        });
                    }, 1000);
                } else {
                    setTimeout(() => {
                        steps.innerHTML += '<p>✅ Payment successful!</p>';
                        window.trackCheckout('completed');
                    }, 1000);
                }
            }, 3000);
        }
    </script>
</body>
</html>
